name: Publicar Senadores en Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senadoresbbc-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar datos y preparar únicamente archivos públicos
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path.cwd()
          destination = root / '_site'
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir()
          directories = {'assets', 'data', 'admin', 'calendario', 'comunidad', 'entradas', 'equipo', 'historia', 'noticias', 'videos'}
          root_extensions = {'.html', '.css', '.js', '.json', '.xml', '.txt', '.ico', '.svg', '.webmanifest'}
          excluded = {'config.template.yml'}
          for item in root.iterdir():
              if item.is_symlink():
                  raise SystemExit('No se permiten enlaces simbólicos en la raíz del sitio.')
              if item.is_dir() and item.name in directories:
                  for child in item.rglob('*'):
                      if child.is_symlink():
                          raise SystemExit('No se permiten enlaces simbólicos en archivos públicos.')
                      if child.is_file() and not any(part.startswith('.') for part in child.relative_to(root).parts) and child.name not in excluded:
                          target = destination / child.relative_to(root)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(child, target)
              elif item.is_file() and not item.name.startswith('.') and (item.suffix in root_extensions or item.name in {'_headers', '_redirects'}):
                  # README files document setup and are not site assets.
                  if not item.name.lower().startswith(('readme', 'license')):
                      shutil.copyfile(item, destination / item.name)

          loaded = {}
          for file in (destination / 'data').glob('*.json'):
              loaded[file.name] = json.loads(file.read_text())
          for filename, key in [('news.json', 'news'), ('roster.json', 'players'), ('calendar.json', 'games'), ('instagram.json', 'assets')]:
              rows = loaded[filename][key]
              identifiers = [str(row['id']) for row in rows]
              if len(identifiers) != len(set(identifiers)) or any(row['id'] is None or str(row['id']).strip() == '' for row in rows):
                  raise SystemExit(f'IDs vacíos o duplicados en {filename}.')
              if key in {'players', 'games'} and any(not re.fullmatch(r'[0-9]+', str(row['id'])) for row in rows):
                  raise SystemExit(f'ID numérico inválido en {filename}.')
              if key == 'news' and any(not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', str(row['id'])) for row in rows):
                  raise SystemExit('Identificador de noticia inválido.')

          def validate_images(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {'image', 'photo', 'logo'} and child is not None:
                          if not isinstance(child, str):
                              raise SystemExit('Una imagen debe ser una ruta local.')
                          path = urlsplit(child)
                          relative = unquote(path.path).lstrip('/')
                          target = (destination / relative).resolve()
                          if path.scheme or path.netloc or not relative.startswith('assets/') or not target.is_relative_to(destination.resolve()) or not target.is_file():
                              raise SystemExit('Imagen local inexistente o ruta no permitida.')
                      validate_images(child)
              elif isinstance(value, list):
                  for child in value:
                      validate_images(child)
          validate_images(loaded)

          # A pending preview/configuration must never silently become the production editor.
          connection = json.loads((destination / 'admin/connection.json').read_text())
          config_file = destination / 'admin/config.yml'
          if connection.get('enabled') is not True or connection.get('configurationFile') != '/admin/config.yml' or not config_file.is_file():
              raise SystemExit('El editor todavía no está conectado. Completa la configuración antes de activar CI.')
          # config.yml is deliberately JSON (a YAML subset), so no third-party parser is needed.
          config = json.loads(config_file.read_text())
          backend = config.get('backend', {})
          auth = urlsplit(backend.get('base_url', ''))
          if backend.get('name') != 'github' or backend.get('repo', '').lower() != os.environ['GITHUB_REPOSITORY'].lower() or backend.get('branch') != 'main':
              raise SystemExit('El backend del editor no coincide con este repositorio y rama main.')
          if auth.scheme != 'https' or not auth.netloc or auth.path not in {'', '/'} or auth.query or auth.fragment or auth.username or auth.password or auth.hostname.endswith('.invalid'):
              raise SystemExit('Falta un origen HTTPS real para OAuth.')
          if backend.get('auth_endpoint', 'auth') != 'auth' or config.get('site_url') != 'https://senadoresbbc.pages.dev':
              raise SystemExit('El editor debe utilizar /auth y el sitio de producción esperado.')

          forbidden_names = {'.dev.vars', '.env', 'wrangler.toml', 'wrangler.json', 'wrangler.jsonc'}
          secret_pattern = re.compile(r'(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)')
          for file in destination.rglob('*'):
              if file.is_file():
                  if file.name in forbidden_names or file.name.startswith(('.env.', '.dev.vars.')):
                      raise SystemExit('Se detectó un archivo de configuración privada en el sitio público.')
                  if file.suffix in {'.html', '.css', '.js', '.json', '.yml', '.yaml', '.txt'}:
                      content = file.read_text()
                      if secret_pattern.search(content) or re.search(r'(?i)["\x27]?(?:client_secret|github_client_secret|oauth_state_secret|cloudflare_api_token)["\x27]?\s*[:=]', content):
                          raise SystemExit('Se detectó una posible credencial en un archivo público.')
          print('Datos y archivos públicos validados; el Worker OAuth y las credenciales quedan fuera del sitio.')
          PY
      - name: Conservar artefacto validado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: senadoresbbc-public
          path: _site
          retention-days: 1

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Recuperar artefacto validado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: senadoresbbc-public
          path: _site
      - name: Publicar en el proyecto existente
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: pages deploy _site --project-name=senadoresbbc --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
