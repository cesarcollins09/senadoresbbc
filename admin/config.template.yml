    {
      "name": "noticias",
      "label": "Noticias",
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "news",
          "label": "Noticias",
          "file": "data/news.json",
          "format": "json",
          "fields": [
            {
              "label": "Noticias",
              "name": "news",
              "widget": "list",
              "fields": [
                {
                  "label": "Identificador",
                  "name": "id",
                  "widget": "string",
                  "pattern": [
                    "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                    "Usa letras minúsculas, números y guiones; debe ser único."
                  ],
                  "hint": "Identificador único y estable de esta noticia."
                },
                {
                  "label": "Categoría",
                  "name": "category",
                  "widget": "select",
                  "options": [
                    {
                      "label": "El equipo",
                      "value": "equipo"
                    },
                    {
                      "label": "La liga",
                      "value": "liga"
                    }
                  ]
                },
                {
                  "label": "Etiqueta visible",
                  "name": "label",
                  "widget": "string",
                  "hint": "Por ejemplo: EL EQUIPO o LA LIGA."
                },
                {
                  "label": "Fecha visible",
                  "name": "date",
                  "widget": "string",
                  "hint": "Texto que verá el aficionado. Ejemplo: 31 OCT 2026."
                },
                {
                  "label": "Imagen principal",
                  "name": "image",
                  "widget": "image",
                  "hint": "Sube una imagen o selecciona una existente. Se guarda una ruta /assets/… ."
                },
                {
                  "label": "Descripción de la imagen",
                  "name": "alt",
                  "widget": "string"
                },
                {
                  "label": "Título",
                  "name": "title",
                  "widget": "string"
                },
                {
                  "label": "Resumen",
                  "name": "summary",
                  "widget": "text"
                },
                {
                  "label": "Párrafos",
                  "name": "paragraphs",
                  "widget": "list",
                  "field": {
                    "label": "Párrafo",
                    "name": "paragraph",
                    "widget": "text"
                  },
                  "min": 1
                },
                {
                  "label": "Título de la publicación de origen",
                  "name": "sourceTitle",
                  "widget": "string"
                },
                {
                  "label": "Enlace a la publicación original",
                  "name": "url",
                  "widget": "string",
                  "pattern": [
                    "^https://[^\\s]+$",
                    "Usa un enlace HTTPS completo."
                  ]
                },
                {
                  "label": "Nombre de la fuente",
                  "name": "sourceName",
                  "widget": "string",
                  "required": false,
                  "hint": "Opcional. Ejemplo: LMBP o Prensa Senadores. Si se omite, se muestra LMBP."
                },
                {
                  "label": "Crédito de la imagen",
                  "name": "imageCredit",
                  "widget": "string",
                  "required": false,
                  "hint": "Opcional. Identifica al fotógrafo o a la fuente de la imagen."
                }
              ],
              "summary": "{{fields.title}}",
              "collapsed": true,
              "allow_add": true,
              "allow_remove": true,
              "allow_reorder": true
            }
          ]
        }
      ]
    },
    {
