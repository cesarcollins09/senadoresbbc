                },
                {
                  "label": "Nombre de la posición",
                  "name": "positionLabel",
                  "widget": "string"
                },
                {
                  "label": "Lanza",
                  "name": "throws",
                  "widget": "select",
                  "options": [
                    "R",
                    "L",
                    "S"
                  ],
                  "hint": "R: derecha. L: izquierda. S: ambas."
                },
                {
                  "label": "Batea",
                  "name": "bats",
                  "widget": "select",
                  "options": [
                    "R",
                    "L",
                    "S"
                  ],
                  "hint": "R: derecha. L: izquierda. S: ambidiestro."
                },
                {
                  "label": "Fecha de nacimiento",
                  "name": "birthdate",
                  "widget": "nullable-string",
                  "required": false,
                  "pattern": [
                    "^\\d{4}-\\d{2}-\\d{2}$",
                    "Usa AAAA-MM-DD."
                  ],
                  "hint": "Formato AAAA-MM-DD. Vacío significa que la fuente no informa el dato."
                },
                {
                  "label": "Perfil oficial",
                  "name": "profileUrl",
                  "widget": "string",
                  "pattern": [
                    "^https://[^\\s]+$",
                    "Usa un enlace HTTPS completo."
                  ]
                },
                {
                  "label": "Retrato",
                  "name": "photo",
                  "widget": "image",
                  "required": false,
                  "hint": "Retrato opcional. Sube una foto o elige una imagen de Medios. Vacío conserva null si la fuente no tiene retrato."
                }
              ],
              "summary": "{{fields.displayName}} · {{fields.position}}",
              "collapsed": true
            }
          ]
        }
      ]
    },
