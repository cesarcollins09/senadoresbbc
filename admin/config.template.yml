                  "step": 1
                },
                {
                  "label": "Nombre completo",
                  "name": "name",
                  "widget": "string"
                },
                {
                  "label": "Nombre para mostrar",
                  "name": "displayName",
                  "widget": "string"
                },
                {
                  "label": "Número de uniforme",
                  "name": "number",
                  "widget": "nullable-string",
                  "required": false,
                  "pattern": [
                    "^\\d+$",
                    "Usa dígitos. El 0 es un número válido."
                  ],
                  "hint": "Se guarda como texto para conservar 0. Vacío conserva null."
                },
                {
                  "label": "Posición",
                  "name": "position",
                  "widget": "select",
                  "options": [
                    "P",
                    "C",
                    "IF",
                    "OF",
                    "C/IF"
